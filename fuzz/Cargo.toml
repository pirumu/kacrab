[package]
name = "kacrab-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Detached from the workspace on purpose: `cargo-fuzz` builds these targets with
# a nightly toolchain and `-Z sanitizer`, which the pinned stable toolchain in
# rust-toolchain.toml cannot do. Keeping it out of the workspace means
# `make test` / `make clippy` never try to compile it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.kacrab-protocol]
path = "../kacrab-protocol"
features = ["gzip", "snappy", "lz4", "zstd"]

# `__fuzzing` re-exports the crate-private SASL handshake parsers as thin
# `fn(&[u8])` shims. They read bytes from a peer that has not authenticated yet,
# which makes them the highest-value untrusted input in the client.
[dependencies.kacrab]
path = "../kacrab"
features = ["__fuzzing"]

# Fuzz targets are built with debug assertions so arithmetic overflow is a
# finding rather than a silent wrap.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[[bin]]
name = "record_batch_decode"
path = "fuzz_targets/record_batch_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_batch_framed"
path = "fuzz_targets/record_batch_framed.rs"
test = false
doc = false
bench = false

