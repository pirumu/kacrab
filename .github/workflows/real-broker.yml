name: real-broker

# Runs the ignored `real_kafka_*` integration suites against live Kafka
# containers from the repo's docker-compose files. These suites are the
# only coverage for the consumer's broker-I/O path (client/coordinator/
# next_gen are excluded from the unit-coverage gate because they cannot be
# driven against a dead broker), so without this workflow a green CI says
# nothing about that path.
#
# The `base` job is a matrix over broker releases — 3.3.2 / 3.6.2 / 3.9.0 /
# 4.0.0 / 4.3.0 — because kacrab's protocol schemas are generated from the Java
# client 4.3.0 and every older broker is reached by ApiVersions negotiation.
# Only a real old broker proves that negotiation works; see the "Broker version
# matrix" section below for what runs where and why.
#
# Each job gets its own runner VM, so the composes' host-port choices never
# collide across jobs. The broker is started before the Rust toolchain/build
# steps so image pull + KRaft format overlap with the cargo build, then a
# second `up -d --wait <service>` acts as the health gate. `--wait` is scoped
# to the broker services on purpose: the one-shot `kafka-init` topic-seeding
# containers exit after finishing, and gating on them via `--wait` is
# version-sensitive; `docker wait <container>` handles them instead.
#
# The auth-listener suites (SASL / TLS / GSSAPI) live in
# real-broker-auth.yml on a weekly schedule — they exercise handshake code
# that rarely changes and need heavier fixtures (KDC, cert generation).
#
#
# ## Broker version matrix
#
# Every compose file already reads `${KAFKA_IMAGE:-apache/kafka:4.3.0}`; this
# workflow is what finally sets it.
#
# EVERY leg runs EVERY suite, unfiltered, and EVERY leg blocks. The tests
# declare their own broker floors: a version-sensitive test opens with a
# `require_broker_api!(<api> => <min version>)` guard (kacrab/tests/common/
# broker_capability.rs) that asks the connected broker's `ApiVersions`
# response — never a release number — whether it serves what the test needs,
# and otherwise prints a named `SKIPPED: <test> needs <api> >= v<n>` line and
# passes as a skip. The workflow therefore carries no test-name filters and no
# tier split; the per-surface floor table those guards define is published in
# docs-book/src/broker-compatibility.md. On the current matrix that means:
#
#   - `real_kafka_consumer_protocol_kip848` (ConsumerGroupHeartbeat >= v1)
#     self-skips on 3.6.2 and 3.9.0, runs from 4.0.0.
#   - the share-consumer suite (KIP-932: ShareGroupHeartbeat / ShareFetch /
#     ShareAcknowledge >= v1) self-skips everywhere below 4.3.0.
#   - everything else — producer, transactions, classic consumer, consumer
#     ops, compression, admin smoke, admin behavior — runs on every leg;
#     verified green against bitnamilegacy/kafka:3.6.2.
#
# `real_kafka_admin_smoke` additionally reports per-op capability SKIPPED
# lines of its own (e.g. `list_config_resources(Topic)` on brokers that serve
# API 74 at v0 only, or not at all) — same principle, finer grain.
#
# The one remaining name filter below — `real_kafka_admin_smoke` vs
# `real_kafka_admin_extended` — selects a broker *fixture*, not a broker
# version: the extended half needs the authorizer broker from
# docker-compose.kafka-admin.yml and runs in the `admin-extended` job.
#
# Wall time: the suites run `--test-threads=1` (they share one broker and name
# topics with millisecond nonces, so parallel runs collide), which makes each
# leg a full serial pass. Five legs is five times the wall clock, so pull
# requests get two legs — 4.3.0 and 3.6.2, newest plus the oldest PR-eligible
# leg, where a negotiation break would show up first — and the complete matrix
# runs on push-to-master, on the nightly schedule, and on demand.
#
# ### The 3.3.2 leg — first CI evidence inside the 2.4–3.5 range (issue #50)
#
# Everything below 3.6 used to be "accepted, not yet CI-verified". The 3.3.2
# leg is the first container from that range: 3.3 is the line where KRaft went
# GA (KIP-833, 3.3.1), so it still fits the repo's single-broker
# combined-roles compose shape with no ZooKeeper. It gets its own compose file
# (docker-compose.kafka-33.yml) because the 3.3-era Bitnami image needs
# `KAFKA_ENABLE_KRAFT=yes` spelled out where the 3.6-era scripts infer KRaft
# from `process.roles`. Nightly/push only (`pr: false`) — a fifth serial leg
# is not worth every PR's wall clock. Verified green locally against
# bitnamilegacy/kafka:3.3.2 across the whole core tier: producer 9/9,
# producer-txn 5/5, classic consumer 13/13, consumer-ops 8/8, compression
# round-trip, and admin smoke with the same two SKIPPED ops as 3.6.2.
# A pre-KRaft (ZooKeeper) leg for 2.8 remains follow-up work on issue #50.

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs-book/**"
      - "**/*.md"
      - "LICENSE-*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "docs-book/**"
      - "**/*.md"
      - "LICENSE-*"
      - ".github/workflows/docs.yml"
  # Nightly full matrix: catches drift in the old-broker legs that PRs skip.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled and push runs share `github.ref` on master, so the event name is
  # part of the key — otherwise the nightly full matrix would cancel (or be
  # cancelled by) a merge landing at the same time.
  group: real-broker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  legs:
    name: pick broker legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
    steps:
      # The single source of truth for the matrix. Each leg carries everything
      # the `base` job needs to differ:
      #
      #   image       broker image to run. `apache/kafka` publishes no tag older
      #               than 3.7, so 3.6 and 3.3 come from Bitnami — and from
      #               `bitnamilegacy/`, not `bitnami/`: the 3.x tags were removed
      #               from the original repo when Bitnami moved its back
      #               catalogue in 2025. Same image, current name. These five
      #               images are exactly the ones the ApiVersions fixtures were
      #               captured from (kacrab/tests/fixtures/api_versions/README.md).
      #   compose     Bitnami configures the broker through `KAFKA_CFG_*` rather
      #               than the `KAFKA_*` shape the Apache image reads, so 3.6 gets
      #               its own compose file instead of an overlay (an overlay can
      #               only add keys, never drop the ones that would no longer
      #               apply). 3.3 gets a third file because that era of the image
      #               additionally needs `KAFKA_ENABLE_KRAFT=yes` (see the file's
      #               header).
      #   path_shim   whether `/opt/kafka` and `/var/lib/kafka` have to be
      #               symlinked into the container before the suites run.
      #   pr          whether this leg runs on pull requests.
      - name: Select legs for this event
        id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          all='[
            {"label":"4.3.0","image":"apache/kafka:4.3.0","compose":"docker-compose.kafka.yml","path_shim":false,"pr":true},
            {"label":"4.0.0","image":"apache/kafka:4.0.0","compose":"docker-compose.kafka.yml","path_shim":false,"pr":false},
            {"label":"3.9.0","image":"apache/kafka:3.9.0","compose":"docker-compose.kafka.yml","path_shim":false,"pr":false},
            {"label":"3.6.2","image":"bitnamilegacy/kafka:3.6.2","compose":"docker-compose.kafka-bitnami.yml","path_shim":true,"pr":true},
            {"label":"3.3.2","image":"bitnamilegacy/kafka:3.3.2","compose":"docker-compose.kafka-33.yml","path_shim":true,"pr":false}
          ]'
          if [ "$EVENT" = "pull_request" ]; then
            legs=$(printf '%s' "$all" | jq -c '[.[] | select(.pr)]')
          else
            legs=$(printf '%s' "$all" | jq -c '.')
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          printf 'legs for %s: %s\n' "$EVENT" "$legs"

  base:
    name: base broker ${{ matrix.leg.label }}
    needs: legs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A break on one broker release must not cancel the other legs: each leg
      # is an independent compatibility signal, and the full picture — which
      # releases a regression reaches — is exactly what the matrix is for.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.legs.outputs.legs) }}
    env:
      # Read by every `docker compose` invocation below; the compose files all
      # default to apache/kafka:4.3.0 when it is unset.
      KAFKA_IMAGE: ${{ matrix.leg.image }}
      COMPOSE_FILE_KAFKA: ${{ matrix.leg.compose }}
    steps:
      - uses: actions/checkout@v4

      # Boot the broker in the background; image pull + KRaft format run
      # while the toolchain installs and the tests compile.
      - name: Start Kafka (background)
        run: docker compose -f "$COMPOSE_FILE_KAFKA" up -d

      # gssapi (libgssapi) needs libkrb5; --all-features pulls it in.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build real-broker test binaries
        run: cargo test -p kacrab --all-features --no-run

      - name: Wait for broker health
        run: |
          docker compose -f "$COMPOSE_FILE_KAFKA" up -d --wait kafka
          docker wait kacrab-kafka-init

      # The suites shell out to `/opt/kafka/bin/*.sh` inside the broker container
      # and dump log segments from `/var/lib/kafka/data` — the Apache image's
      # layout. Bitnami ships KAFKA_HOME at /opt/bitnami/kafka and its data dir at
      # /bitnami/kafka/data (the one directory that image leaves writable for its
      # uid-1001 user, so the volume has to stay there). Symlink rather than teach
      # the test files about image layouts: the tests describe kacrab's behaviour,
      # not Docker packaging.
      - name: Apache path layout shim
        if: matrix.leg.path_shim
        run: |
          docker exec -u 0 kacrab-kafka sh -c \
            'ln -sfn /opt/bitnami/kafka /opt/kafka && ln -sfn /bitnami/kafka /var/lib/kafka'
          # Prove the shim before any suite depends on it, and record what this
          # broker actually advertises next to the fixture that claims to match.
          docker exec kacrab-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
            --bootstrap-server localhost:9092 > api-versions.txt
          head -5 api-versions.txt

      # The first consumer-group operation on a fresh broker creates the
      # 50-partition __consumer_offsets topic, which is slow enough to flake
      # the first group test of the run (observed locally: first run after
      # boot 13/14, every later run 14/14). Join a throwaway group once so
      # the suites never pay that cost.
      - name: Warm up internal topics
        run: |
          docker exec kacrab-kafka sh -c \
            "/opt/kafka/bin/kafka-console-consumer.sh \
               --bootstrap-server kafka:29092 --topic kacrab-bench \
               --group kacrab-ci-warmup --timeout-ms 10000 --max-messages 1 \
               >/dev/null 2>&1 || true"

      # --- the suites: identical on every leg ----------------------------
      #
      # No test-name filters and no per-leg conditions: version-sensitive
      # tests carry their own `require_broker_api!` guard and self-skip with a
      # named SKIPPED line (see the header). The suites are therefore exactly
      # what a developer runs from a shell against any broker.
      #
      # Suites share one broker and name topics with millisecond nonces, so
      # they must run single-threaded (parallel runs collide with
      # TopicAlreadyExists).
      - name: Producer suite
        id: producer
        run: cargo test -p kacrab --all-features --test real_kafka_producer -- --ignored --test-threads=1 --nocapture

      # Transactional producer suite: send_offsets_to_transaction (KIP-98
      # consume-transform-produce), zombie fencing, and abort-then-commit
      # reuse — all classic transaction APIs every matrix broker serves.
      - name: Producer transactions suite
        id: producer_txn
        run: cargo test -p kacrab --all-features --test real_kafka_producer_txn -- --ignored --test-threads=1 --nocapture

      # Classic-protocol tests run everywhere; `real_kafka_consumer_protocol_
      # kip848` guards on ConsumerGroupHeartbeat >= v1 and self-skips on 3.3.2
      # and 3.6.2 (API absent) and 3.9.0 (early-access v0 only, behind a broker
      # feature flag this fixture does not enable).
      - name: Consumer suite
        id: consumer
        run: cargo test -p kacrab --all-features --test real_kafka_consumer -- --ignored --test-threads=1 --nocapture

      # Consumer ops suite: manual assign, seek, pause/resume,
      # offsets_for_times, headers, static membership, auto.offset.reset, and
      # enforce_rebalance — all classic-protocol operations every matrix
      # broker serves.
      - name: Consumer ops suite
        id: consumer_ops
        run: cargo test -p kacrab --all-features --test real_kafka_consumer_ops -- --ignored --test-threads=1 --nocapture

      # Compression is a client-side record-batch concern that every broker in
      # the matrix stores unchanged: kacrab-produces->CLI-decodes and
      # CLI-produces->kacrab-decodes both run on every leg.
      - name: Compression round-trip suite
        id: compression
        run: cargo test -p kacrab --all-features --test real_kafka_compression -- --ignored --test-threads=1 --nocapture

      # Only the smoke half runs here; real_kafka_admin_extended needs the
      # authorizer broker from docker-compose.kafka-admin.yml (admin-extended
      # job below) — a fixture split, not a version split. The smoke test
      # reports its own per-op capability SKIPPED lines on old brokers.
      - name: Admin smoke suite
        id: admin_smoke
        run: cargo test -p kacrab --all-features --test real_kafka_admin -- --ignored --test-threads=1 --nocapture real_kafka_admin_smoke

      # Admin behavior suite: state read back after every mutation (topic
      # lifecycle, incremental config alter, group-offset alter/delete, live
      # transaction describes) rather than wire-ok smoke. The cluster/quorum/
      # features assertions describe any single-broker KRaft fixture, not one
      # release's shape — verified green against bitnamilegacy/kafka:3.6.2.
      - name: Admin behavior suite
        id: admin_behavior
        run: cargo test -p kacrab --all-features --test real_kafka_admin_behavior -- --ignored --test-threads=1 --nocapture

      # Share groups (KIP-932) are broker-side machinery — acquisition locks,
      # delivery counts, redelivery — so this suite is the only coverage of the
      # share consumer's behaviour, not just its wire encoding. Every test
      # guards on the three KIP-932 APIs and self-skips below 4.3.0.
      - name: Share consumer suite
        id: share
        run: cargo test -p kacrab --all-features --test real_kafka_share_consumer -- --ignored --test-threads=1 --nocapture

      # One table per leg in the run summary, so which surfaces ran on which
      # broker is visible without opening four job logs. A blank outcome means
      # an earlier suite failed and stopped the leg there.
      - name: Suite outcomes
        if: always()
        run: |
          {
            echo "### broker ${{ matrix.leg.image }}"
            echo
            echo "| suite | outcome |"
            echo "| --- | --- |"
            echo "| producer | ${{ steps.producer.outcome }} |"
            echo "| producer (transactions) | ${{ steps.producer_txn.outcome }} |"
            echo "| consumer | ${{ steps.consumer.outcome }} |"
            echo "| consumer (ops) | ${{ steps.consumer_ops.outcome }} |"
            echo "| compression | ${{ steps.compression.outcome }} |"
            echo "| admin smoke | ${{ steps.admin_smoke.outcome }} |"
            echo "| admin behavior | ${{ steps.admin_behavior.outcome }} |"
            echo "| share consumer | ${{ steps.share.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Broker logs on failure
        if: failure()
        run: docker logs kacrab-kafka --tail 300

  admin-extended:
    name: admin broker (ACLs · quotas · SCRAM · txn)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not matrixed. docker-compose.kafka-admin.yml depends on 4.3.0 broker
    # defaults — share and streams group features are formatted on at that
    # release, and the suite drives unstable APIs behind them — so pointing this
    # fixture at an older image does not produce an older-broker signal, it
    # produces a broker missing the features the suite is about. The per-test
    # `require_broker_api!` gating does not change that: it gates on advertised
    # APIs, and this fixture's constraint is formatted feature state.
    env:
      KAFKA_IMAGE: apache/kafka:4.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Start Kafka with authorizer (background)
        run: docker compose -f docker-compose.kafka-admin.yml up -d

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build real-broker test binaries
        run: cargo test -p kacrab --all-features --no-run

      - name: Wait for broker health
        run: docker compose -f docker-compose.kafka-admin.yml up -d --wait kafka

      - name: Admin extended suite
        run: cargo test -p kacrab --all-features --test real_kafka_admin -- --ignored --test-threads=1 --nocapture real_kafka_admin_extended

      - name: Broker logs on failure
        if: failure()
        run: docker logs kacrab-kafka-admin --tail 300

  cluster:
    name: 3-broker cluster (dispatch · leader failover)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not matrixed. The suite is about dispatch and leader failover across
    # three brokers, which is orthogonal to version negotiation, and tripling
    # the container count on every leg buys the compatibility table nothing.
    env:
      KAFKA_IMAGE: apache/kafka:4.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Start 3-broker cluster (background)
        run: docker compose -f docker-compose.cluster.yml up -d

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build real-broker test binaries
        run: cargo test -p kacrab --all-features --no-run

      - name: Wait for cluster health
        run: |
          docker compose -f docker-compose.cluster.yml up -d --wait kafka1 kafka2 kafka3
          docker wait kacrab-kafka-cluster-init

      # Fresh topic creation spreads preferred leaders, but run the election
      # anyway (the failover test's leadership map assumes it — see the test's
      # module docs).
      - name: Preferred leader election
        run: |
          docker exec kacrab-kafka1 /opt/kafka/bin/kafka-leader-election.sh \
            --bootstrap-server kafka1:29092 --election-type PREFERRED \
            --all-topic-partitions

      - name: Cluster suite
        run: cargo test -p kacrab --all-features --test real_kafka_cluster -- --ignored --test-threads=1 --nocapture

      - name: Broker logs on failure
        if: failure()
        run: |
          for broker in kacrab-kafka1 kacrab-kafka2 kacrab-kafka3; do
            echo "===== $broker ====="
            docker logs "$broker" --tail 150
          done
