name: real-broker-interop

# Cross-client interop suite (issue #49): the JVM Kafka client tooling that
# ships inside the compose broker container (`kafka-verifiable-producer.sh`,
# `kafka-verifiable-consumer.sh`, the console tools, `kafka-consumer-groups.sh`)
# on one side, kacrab on the other, against the live broker. Each direction
# asserts payload equality (keys/values/headers/timestamps), group-offset
# agreement, and transactional visibility under both isolation levels — see
# kacrab/tests/real_kafka_interop.rs.
#
# Deliberately a separate workflow from real-broker.yml, and a single 4.3.0
# job rather than a matrix leg: the JVM peer is the tooling of the 4.3.0
# container itself, so pointing the suite at an older broker image would swap
# BOTH the broker and the Java client at once and the result would not be an
# older-broker compatibility signal. The setup steps mirror real-broker.yml's
# `base` job (background boot, cache, `--wait` health gate, warm-up).

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs-book/**"
      - "**/*.md"
      - "LICENSE-*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "docs-book/**"
      - "**/*.md"
      - "LICENSE-*"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-broker-interop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  interop:
    name: cross-client interop (4.3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAFKA_IMAGE: apache/kafka:4.3.0
    steps:
      - uses: actions/checkout@v4

      # Boot the broker in the background; image pull + KRaft format run
      # while the toolchain installs and the tests compile.
      - name: Start Kafka (background)
        run: docker compose -f docker-compose.kafka.yml up -d

      # gssapi (libgssapi) needs libkrb5; --all-features pulls it in.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build real-broker test binaries
        run: cargo test -p kacrab --all-features --no-run

      - name: Wait for broker health
        run: |
          docker compose -f docker-compose.kafka.yml up -d --wait kafka
          docker wait kacrab-kafka-init

      # The first consumer-group operation on a fresh broker creates the
      # 50-partition __consumer_offsets topic, which is slow enough to flake
      # the first group test of the run. Join a throwaway group once so the
      # suite never pays that cost.
      - name: Warm up internal topics
        run: |
          docker exec kacrab-kafka sh -c \
            "/opt/kafka/bin/kafka-console-consumer.sh \
               --bootstrap-server kafka:29092 --topic kacrab-bench \
               --group kacrab-ci-warmup --timeout-ms 10000 --max-messages 1 \
               >/dev/null 2>&1 || true"

      # Shares one broker with per-test unique topic/group names; the suite is
      # serial (`--test-threads=1`) like every other real-broker suite.
      - name: Cross-client interop suite
        run: cargo test -p kacrab --all-features --test real_kafka_interop -- --ignored --test-threads=1 --nocapture

      - name: Broker logs on failure
        if: failure()
        run: docker logs kacrab-kafka --tail 300
