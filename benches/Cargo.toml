[package]
name = "kacrab-benches"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
readme = "README.md"

[dependencies]
# `__bench` is kacrab's internal, semver-exempt diagnostics feature (dispatch-latency
# sampler, sync-send spin counter). Benchmarks are its only intended consumer.
kacrab = { workspace = true, features = ["admin", "producer", "consumer", "__bench"] }
kacrab-protocol = { workspace = true }
bytes = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[[bench]]
name = "producer_accumulator"
harness = false

[[bench]]
name = "wire_pipeline"
harness = false

[[bench]]
name = "wire_read_frame"
harness = false

[[bench]]
name = "producer_dispatcher"
harness = false

[lints]
workspace = true
